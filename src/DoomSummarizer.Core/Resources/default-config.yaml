# ─── Global API Budget ───────────────────────────────────────────────
api_budget:
  global_max_requests_per_day: 500     # Total requests/day across all paid APIs (0 = unlimited)
  global_daily_budget_usd: 2.0         # Total daily spend cap in USD (0 = unlimited)

# ─── Vibes (Synthesis Personalities) ─────────────────────────────────
# Each vibe defines the tone and focus for article synthesis.
# You can add custom vibes or override the built-in ones.
vibes:
  doom: "Pessimistic, concerning. Focus on threats, vulnerabilities, layoffs, debt, industry problems."
  hopeful: "Optimistic, encouraging. Highlight innovations, tools, opportunities, positive developments."
  snarky: "Sharp dry wit. Mock hype and buzzwords. Deadpan humor, ironic observations, 'well actually' energy."
  funny: "Genuinely funny. Puns, absurd analogies, playful exaggeration. Comedy writer covering the news."
  upbeat: "High energy! Exclamation points, celebrate wins, highlight exciting parts. Three-coffees enthusiasm."
  friendly: "Warm, conversational. Explaining to a smart friend over coffee. Use 'you' and 'we'."
  toon: "Comic-strip energy. Bold exaggeration, sound effects (WHAM! KABOOM!), dramatic reveals, cartoon logic. Every story is an episode."
  neutral: "Objective, balanced. Just the facts, no emotional coloring."
