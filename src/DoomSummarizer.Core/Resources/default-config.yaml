# ═══════════════════════════════════════════════════════════════════════
# DoomSummarizer — Default Configuration
# ═══════════════════════════════════════════════════════════════════════
#
# This file defines ALL settings and their defaults.
# Do NOT edit this file — it ships with the app as an embedded resource.
#
# To customize settings, create ~/.doomsummarizer/config.json (or
# ./doomsummarizer.json in the working directory) with just the values
# you want to override. Run `doomsummarizer config --reference` to view
# this file, or `doomsummarizer config --init` to generate a starter.
#
# Loading order (highest priority wins):
#   1. This file (embedded defaults)
#   2. ~/.doomsummarizer/config.json (user overrides)
#   3. ./doomsummarizer.json (local/project overrides)
#   4. Environment variables / .NET user secrets (API keys)
# ═══════════════════════════════════════════════════════════════════════

# ─── Content Sources ─────────────────────────────────────────────────
sources:
  hacker_news:
    enabled: true
    sections: [ top, best, new ]   # HN sections to fetch: top, best, new, ask, show, job
    max_stories: 30              # Max stories to fetch per run
    min_score: 50                # Minimum upvote score to include

  reddit:
    enabled: true
    subreddits: # Subreddits to monitor
      - programming
      - csharp
      - dotnet
      - ExperiencedDevs
      - technology
    sort: hot                    # Sort order: hot, new, top
    max_posts: 25                # Max posts to fetch per run
    min_score: 20                # Minimum upvote score to include

  websites: [ ]                   # Custom website entries: [{url, selector, use_playwright}]
    # Example:
    #   - url: "https://example.com/blog"
    #     selector: "article"      # CSS selector for content
  #     use_playwright: false     # Use headless browser for JS sites

# ─── Source Filtering & Weighting ────────────────────────────────────
source_filter:
  allowed_domains: [ ]            # If non-empty, ONLY items from these domains are kept (allowlist)
  blocked_domains: [ ]            # Items from these domains are removed post-fetch

  # Source reliability weights — applied as RRF score multipliers.
  # Key = source name or domain substring. Value = multiplier.
  # 1.0 = neutral, >1.0 = boost, <1.0 = penalize, 0 = block.
  weights:
    reuters: 1.4
    bbc: 1.3
    guardian: 1.2
    ars: 1.2
    hn: 1.1
    arxiv: 1.3
    reddit: 0.9
    search: 0.8
    brave_search: 1.0
    brave_news: 1.1
    serper: 1.0
    serper_news: 1.1
    tavily: 1.0
    newsapi: 1.1
    newsdata: 1.0
    jina: 0.9
    currents: 1.0

# ─── Ollama (Local LLM) ─────────────────────────────────────────────
ollama:
  base_url: "http://localhost:11434"   # Ollama API endpoint
  model: "gemma3:4b"                   # Primary model for synthesis
  sentinel_model: "qwen3:0.6b"        # Fast triage/sentinel model
  embed_model: "nomic-embed-text"      # Embedding model (used when backend=ollama)
  temperature: 0.4                     # LLM temperature (0.0–1.0)
  timeout_seconds: 300                 # Request timeout in seconds
  context_size: 16384                  # Context window (tokens) for primary model
  sentinel_context_size: 32768         # Context window (tokens) for sentinel model

# ─── Embedding ───────────────────────────────────────────────────────
# Embedding calls are automatically cached using an LFU (Least Frequently Used)
# in-memory cache. Repeated queries, anchors, and entity names are served from
# cache (~0µs) instead of recomputed (~1-5ms each). Cache holds 8192 entries
# (~12 MB for 384-dim embeddings) and evicts the least-used entries when full.
# Stats visible in interactive mode after the first turn.
embedding:
  backend: "onnx"                      # Embedding backend: onnx, ollama
  model: "all-MiniLM-L6-v2"           # Embedding model name (see below for options)
  quantized: true                      # Use INT8 quantized model (smaller, faster, ~1-2% quality loss)
  similarity_threshold: 0.95           # Deduplication similarity threshold (0.0–1.0)
  gpu_device_id: 0                     # GPU device for ONNX (0=first, 1=second — select discrete GPU)
  execution_provider: "auto"           # ONNX provider: auto, cpu, cuda, directml
                                       # auto = try DirectML → CUDA → CPU
                                       # Run --list-gpus to see available providers
  # Available models (all 384-dim):
  #   all-MiniLM-L6-v2    — 256 seq, ~23MB quant. Fast general-purpose (default)
  #   bge-small-en-v1.5   — 512 seq, ~34MB quant. Best quality for size
  #   gte-small           — 512 seq, ~34MB quant. Good all-around
  #   multi-qa-MiniLM-L6  — 512 seq, ~23MB quant. QA-optimized
  #   paraphrase-MiniLM-L3— 128 seq, ~17MB quant. Smallest/fastest

# ─── Output ──────────────────────────────────────────────────────────
output:
  format: "markdown"                   # Output format: markdown, html, text
  max_summary_length: 500              # Max chars per article summary
  include_links: true                  # Include source URLs in output
  group_by_topic: true                 # Group articles by detected topic
  default_template: "default"          # Default template for file/doc collections (default|blog-article|compact|...)

# ─── Link Following ─────────────────────────────────────────────────
link_following:
  enabled: true                        # Enable one-hop link following to enrich articles
  max_links_per_article: 3             # Max links to follow per article
  max_total_links: 15                  # Max total linked pages across all articles
  max_content_length: 2000             # Max chars to extract per linked page
  timeout_seconds: 10                  # Timeout per linked page fetch (seconds)

  # Domains to never follow links to (social media, auth, app stores)
  blocked_domains:
    - facebook.com
    - twitter.com
    - x.com
    - instagram.com
    - linkedin.com
    - youtube.com
    - tiktok.com
    - accounts.google.com
    - play.google.com
    - apps.apple.com

  # File extensions to skip when following links
  blocked_extensions:
    - ".pdf"
    - ".zip"
    - ".tar"
    - ".gz"
    - ".exe"
    - ".dmg"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".svg"
    - ".webp"
    - ".mp3"
    - ".mp4"
    - ".mov"
    - ".avi"
    - ".mkv"

# ─── Email ───────────────────────────────────────────────────────────
email:
  provider: "smtp"                     # Email provider: smtp, sendgrid
  enabled: false                       # Enable email delivery
  from_address: ""                     # Sender email address
  from_name: "DoomSummarizer"          # Sender display name
  to_addresses: ""                     # Recipient(s), comma-separated
  subject_template: "Doom Scroll Digest — {{DATE}}"   # Subject line ({{DATE}}, {{QUERY}} placeholders)
  template: "email"                    # Output template for email body

  smtp:
    host: "smtp.gmail.com"             # SMTP server hostname
    port: 587                          # SMTP port (587=STARTTLS, 465=SSL)
    use_ssl: true                      # Use SSL/TLS
    username: ""                       # SMTP username (often your email address)
    password: ""                       # SMTP password (prefer env var or user secrets)

  send_grid_api_key: ""                # SendGrid API key (prefer env var DOOM_SENDGRID)

# ─── Ingestion ──────────────────────────────────────────────────────
# Controls how documents are chunked, embedded, and deduplicated.
# Embedding rate is the key device-profile knob: set it per machine.
ingestion:
  embedding_rate: 100                # % of chunks to embed (100=all, 50=top half by salience)
                                     # Device profiles: desktop=100, laptop=80, pi=40
  deduplication_enabled: true        # Semantic dedup at ingestion (merge near-duplicates)
  deduplication_threshold: 0.90      # Cosine similarity for near-duplicate detection
  salience_boost_enabled: true       # Boost survivors' salience by absorbed duplicate count
  max_chunks_override: 0             # Override max chunk survivors per doc (0=adaptive)
  min_chunks_override: 0             # Override min chunk survivors per doc (0=adaptive)

  # Pre-embedding cheap dedup: eliminate obvious duplicates BEFORE embedding
  # using fast text signals. Saves 20-50% of embedding compute on repetitive docs.
  # Set all weights to 0 to disable pre-dedup entirely.
  pre_dedup:
    word_jaccard: 0.50               # Weight for word-set Jaccard (bag-of-words overlap)
    trigram: 0.30                    # Weight for character trigram Jaccard (catches minor edits)
    length: 0.10                     # Weight for normalized length similarity
    heading: 0.10                    # Weight for title/heading overlap
    threshold: 0.80                  # Combined score threshold: pairs above this are pre-disposed

# ─── Semantic Classifier ────────────────────────────────────────────
# Controls the embedding-based multi-match weighted voting algorithm
# used for deterministic pre-LLM query classification.
# Tune these thresholds to adjust classification sensitivity.
classifier:
  min_candidate_threshold: 0.35    # Minimum cosine similarity to enter candidate set
  min_topic_threshold: 0.35        # Minimum weighted vote score to include a topic
  min_type_threshold: 0.30         # Minimum weighted vote score for type detection
  count_boost: 0.05                # IDF count boost multiplier: max_sim + count_boost * log2(count) * idf
  complex_threshold: 0.50          # Min raw similarity for complex detection
  complex_min_ratio: 0.85          # Complex score must be >= 85% of best overall (prevents false escalation)
  vibe_threshold: 0.60             # Min raw similarity for vibe detection
  vibe_min_ratio: 0.85             # Vibe score must be >= 85% of best overall (prevents false vibes on neutral queries)
  composite_raw_threshold: 0.82    # Min raw similarity (consensus top-2) for composite detection

  # Short-Query Feature Decomposition — structural features supplement embedding
  # for short queries where vocabulary overlap causes noisy similarity scores
  short_query_max_words: 4         # Max word count to consider "short" (features apply more strongly)
  howto_feature_boost: 0.12        # Type boost when "how do I", "set up" etc. detected
  comparison_feature_boost: 0.12   # Type boost when "compare", "vs" etc. detected
  default_roundup_boost: 0.08      # Type boost for roundup on short queries with no intent markers
  qa_feature_boost: 0.10           # Type boost when "what is", "who is" etc. detected
  search_only_feature_threshold: 0.60  # Min confidence for search_only feature override
  synonym_expansion_enabled: false # MiniLM handles abbreviations well without expansion
  short_query_confidence_scale: 0.85  # Scale type confidence down for short queries (signals uncertainty)

# ─── Retrieval Expansion ─────────────────────────────────────────────
expansion:
  concentration_threshold: 0.4      # Fraction of top-K from one source to trigger expansion
  min_relevance: 0.6                # Min avg relevance for concentrated source
  expansion_count: 8                # Extra chunks to pull from concentrated source
  deferred_embedding: true          # Embed low-salience chunks on-demand during expansion

# ─── Background Learning ──────────────────────────────────────────────
# Controls how the classifier learns from sentinel LLM corrections.
# When enabled, sentinel disagreements are logged and periodically analyzed.
learning:
  enabled: true                        # Enable learning from sentinel disagreements
  scan_interval: "06:00:00"            # How often to check for new disagreements (HH:MM:SS)
                                       # CLI: checked on startup, learns if enough time has passed
                                       # Server: background service scan interval
  min_cluster_size: 3                  # Minimum disagreement cluster size to propose an exemplar
  auto_merge: false                    # Auto-merge proposals if tests pass (true = no --learn-apply needed)
  auto_merge_min_improvement: 1        # Minimum net improvement to auto-merge

# ─── Storage ─────────────────────────────────────────────────────────
storage:
  db_path: "~/.doomsummarizer/doom.db" # SQLite database path (~ expands to home dir)
  vector_db_path: "~/.doomsummarizer/vectors.duckdb"  # Vector store database path
  vector_backend: "duckdb"             # Vector backend: duckdb (HNSW, ~96MB) or sqlite-vec (brute-force, ~369KB)
  retention_days: 30                   # Days to keep articles before cleanup

# ─── Plugins ─────────────────────────────────────────────────────────
plugins:
  enable_runtime_plugins: true         # Load plugins from ~/.doomsummarizer/plugins/
  auto_install: [ ]                     # Auto-install on first run (shorthand or NuGet ID)
  disabled: [ ]                         # Plugin keys to disable even if installed
  settings: { }                         # Per-plugin overrides: {key: {enabled, max_items, options}}
    # Example:
    #   settings:
    #     hn:
    #       enabled: true
    #       max_items: 50
    #       options:
  #         sort: "top"

# ─── API Keys & Services ────────────────────────────────────────────
# Each entry defines a service with its API key, budget, and rate limits.
# API keys should be set via environment variables or .NET user secrets,
# not in plain text config files.
#
# Env vars:   DOOM_GOOGLE_SEARCH, DOOM_BRAVE_SEARCH, DOOM_SERPER, etc.
# User secrets: dotnet user-secrets set "keys:0:apiKey" "your-key"
keys:
  - name: google_search
    api_key: ""
    search_engine_id: ""               # Google Custom Search Engine ID (CX)
    enabled: true
    max_requests_per_day: 100
    max_requests: 0                    # Lifetime cap (0 = unlimited)
    daily_budget_usd: 0.50
    cost_per_request: 0.005
    rate_limit_ms: 200                 # Min delay between requests (ms)
    max_retries: 2                     # Retry on 429/5xx errors
    circuit_breaker_threshold: 3       # Consecutive failures before circuit opens
    circuit_breaker_reset_seconds: 300 # Seconds before circuit resets to half-open

  - name: google_places
    api_key: ""
    search_engine_id: ""
    enabled: true
    max_requests_per_day: 50
    max_requests: 0
    daily_budget_usd: 0.85
