name: Unleash DoomSummarizer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.0.1)'
        required: true
        default: '0.0.1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build and test
        run: |
          dotnet build src/DoomSummarizer/DoomSummarizer.csproj -c Release
          dotnet test src/DoomSummarizer.Tests/DoomSummarizer.Tests.csproj \
            -c Release \
            --filter "Category!=Network%26Category!=Smoke%26Category!=RequiresModel%26Category!=Benchmark%26Category!=Integration" \
            --logger "console;verbosity=normal"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        build_type: [slim, slim-nogpu, complete]
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: win-arm64
            os: windows-latest
            ext: .exe
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
          - rid: linux-arm64
            os: ubuntu-latest
            ext: ''
          - rid: osx-x64
            os: macos-latest
            ext: ''
          - rid: osx-arm64
            os: macos-latest
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish single-file
        shell: bash
        run: |
          # slim-nogpu: exclude GPU libs + bundle native libs into single exe (except macOS — Gatekeeper)
          # slim:       include GPU libs + bundle native libs into single exe (except macOS)
          # complete:   full build, native libs alongside binary (LLamaSharp AVX collisions)
          # macOS: keep native libs alongside binary to avoid Gatekeeper blocking unsigned extracted dylibs
          EXTRA_PROPS=""
          if [[ "${{ matrix.build_type }}" == "slim-nogpu" ]]; then
            EXTRA_PROPS="-p:ExcludeGpu=true"
            [[ "${{ matrix.rid }}" != osx-* ]] && EXTRA_PROPS="$EXTRA_PROPS -p:IncludeNativeLibrariesForSelfExtract=true"
          elif [[ "${{ matrix.build_type }}" == "slim" ]]; then
            [[ "${{ matrix.rid }}" != osx-* ]] && EXTRA_PROPS="-p:IncludeNativeLibrariesForSelfExtract=true"
          fi

          dotnet publish src/DoomSummarizer/DoomSummarizer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:CompleteBuild=${{ matrix.build_type == 'complete' && 'true' || 'false' }} \
            -p:Version=${{ github.event.inputs.version }} \
            $EXTRA_PROPS \
            -o ./publish/${{ matrix.rid }}

      - name: Determine archive name
        id: archive_name
        shell: bash
        run: |
          if [[ "${{ matrix.build_type }}" == "complete" ]]; then
            echo "name=lucidrag" >> "$GITHUB_OUTPUT"
            echo "binary=lucidrag" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.build_type }}" == "slim-nogpu" ]]; then
            echo "name=doomsummarizer-nogpu" >> "$GITHUB_OUTPUT"
            echo "binary=doomsummarizer" >> "$GITHUB_OUTPUT"
          else
            echo "name=doomsummarizer" >> "$GITHUB_OUTPUT"
            echo "binary=doomsummarizer" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage archive contents
        shell: bash
        run: |
          mkdir -p ./stage
          BINARY_NAME="${{ steps.archive_name.outputs.binary }}"
          cp ./publish/${{ matrix.rid }}/${BINARY_NAME}${{ matrix.ext }} ./stage/

          # Complete builds: native libs always alongside binary (LLamaSharp AVX collisions)
          # macOS slim builds: native libs alongside binary (Gatekeeper blocks unsigned extracted dylibs)
          # Windows/Linux slim builds: native libs bundled into single file, nothing extra to copy
          if [[ "${{ matrix.build_type }}" == "complete" ]]; then
            cp ./publish/${{ matrix.rid }}/*.dylib ./stage/ 2>/dev/null || true
            cp ./publish/${{ matrix.rid }}/*.so ./stage/ 2>/dev/null || true
            if [[ "${{ matrix.rid }}" == win-* ]]; then
              for f in ./publish/${{ matrix.rid }}/*.dll; do
                [ -f "$f" ] && cp "$f" ./stage/ 2>/dev/null || true
              done
            fi
          elif [[ "${{ matrix.rid }}" == osx-* ]]; then
            # macOS slim: copy dylibs alongside binary (Gatekeeper workaround)
            cp ./publish/${{ matrix.rid }}/*.dylib ./stage/ 2>/dev/null || true
          fi

          cp src/DoomSummarizer/README.md ./stage/
          cp src/DoomSummarizer/Resources/default-config.json ./stage/config.json

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ steps.archive_name.outputs.name }}"
          Compress-Archive -Path ./stage/* -DestinationPath "./publish/${name}-${{ matrix.rid }}.zip"

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="${{ steps.archive_name.outputs.name }}"
          cd ./stage
          tar -czvf "../publish/${name}-${{ matrix.rid }}.tar.gz" *

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive_name.outputs.name }}-${{ matrix.rid }}
          path: ./publish/${{ steps.archive_name.outputs.name }}-${{ matrix.rid }}.*
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: doomsummarizer-v${{ github.event.inputs.version }}
          name: DoomSummarizer v${{ github.event.inputs.version }}
          body: |
            ## DoomSummarizer v${{ github.event.inputs.version }}

            **Reduced GraphRAG in a single binary.** DoomSummarizer is a distillation of [**LucidRAG**](https://github.com/scottgal/lucidrag) principles -- hybrid search, entity extraction, knowledge graph construction, evidence-grounded synthesis -- compressed into a self-contained CLI that runs from a single file. No server, no database setup, no API keys required to start.

            > **[Full documentation, all CLI options, and examples](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/README.md)**

            ### Downloads

            Three variants are available for each platform (all self-contained, no .NET runtime needed):

            | Variant | Description |
            |---------|-------------|
            | `doomsummarizer-nogpu-{platform}` | **Deep Research — Smallest** (~240 MB) — Single executable, CPU-only ONNX embeddings. Web sources, knowledge graph, ONNX BERT NER, hybrid search. Uses Ollama or cloud APIs for LLM. No GPU required. |
            | `doomsummarizer-{platform}` | **Deep Research** (~440 MB) — Single executable with GPU-accelerated ONNX embeddings (DirectML on Windows). Same features as above with faster embeddings. |
            | `lucidrag-{platform}` | **LucidRAG Complete** (~1 GB+) — Everything above + TorchSharp NER, local GGUF inference via LLamaSharp (no Ollama needed), all document formats (DOCX, HTML, PPTX), image/video analysis, OpenCV, YouTube transcription, audio transcription & speaker ID, subtitle processing, email delivery |

            ### What it does

            - **Fetches** from 50+ sources (HN, Reddit, RSS, arXiv, search APIs, any URL) in parallel
            - **Embeds** everything locally with ONNX (all-MiniLM-L6-v2, 384-dim) -- no API calls
            - **Ranks** with multi-signal RRF fusion: BM25 + freshness + authority + semantic similarity + vibe alignment
            - **Builds a graph** -- BERT NER entity extraction, knowledge graph construction, in-corpus PageRank for authority
            - **Crawls** websites with HTTP ETag/Last-Modified cache validation -- incremental re-crawls skip unchanged pages
            - **Follows links** one hop deep for content enrichment, applies TextRank sentence extraction
            - **Persists** everything in SQLite + DuckDB HNSW vectors -- your knowledge base grows with every query
            - **Synthesizes** evidence-grounded answers via LLM (local Ollama or cloud Anthropic/OpenAI)
            - **Generates** long-form articles with a 6-phase evidence-grounded pipeline and output validation

            All of this from a single file. Download, extract, run.

            ### Quick Start (doomsummarizer)

            ```bash
            # 1. Extract and run setup (downloads embedding model, ~23MB one-time)
            doomsummarizer setup

            # 2. Doom scroll -- fetches, ranks, embeds, and summarizes
            doomsummarizer scroll

            # 3. Ask questions over your growing knowledge base
            doomsummarizer ask "What happened with the SSH vulnerability?"

            # Topic-focused with personality
            doomsummarizer scroll "AI security news" --vibe snarky
            ```

            ### Quick Start (lucidrag — complete)

            ```bash
            lucidrag setup
            lucidrag scroll

            # Crawl any site into a named knowledge base (incremental by default)
            lucidrag crawl https://docs.example.com --name docs --entities
            lucidrag ask --source crawl:docs "how does auth work?"

            # Long-form article generation
            lucidrag scroll "history of LLMs" -t blog-article -o llm-history.md
            ```

            ### What's in the archive

            | File | Purpose |
            |------|---------|
            | `doomsummarizer` / `lucidrag` | Self-contained single-file binary (no .NET runtime needed) |
            | `README.md` | Full documentation -- all commands, flags, sources, pipeline details |
            | `config.json` | Default config reference (copy to config directory to customize) |

            > **Note:** Windows and Linux `doomsummarizer-nogpu` and `doomsummarizer` archives contain just 3 files (single exe + docs). macOS archives include native `.dylib` files alongside the binary (required for Gatekeeper compatibility). The `lucidrag` complete archive includes additional native libraries on all platforms.

            ### Works offline, scales up with APIs

            Out of the box, DoomSummarizer uses only free sources (RSS, HTML scraping, DuckDuckGo) and local models (ONNX embeddings, Ollama LLM). Optionally configure cloud search APIs (Brave, Serper, Tavily, NewsAPI) and cloud LLMs (Anthropic Claude, OpenAI GPT-4o) with built-in budget enforcement to stay within free tiers.

            Install [Ollama](https://ollama.com) for LLM synthesis, or use `--nollm` for the full ranking pipeline without it.

            ### Documentation

            - **[Full README with all commands, options, and examples](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/README.md)**
            - **[CLI reference](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/docs/CLI.md)**
            - **[Knowledge base guide](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/docs/KnowledgeBase.md)**
            - **[Source syntax](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/docs/Sources.md)**
            - **[Templates](https://github.com/scottgal/lucidrag/blob/main/src/DoomSummarizer/docs/Templates.md)**

            ### Platforms
            - Windows x64, ARM64
            - Linux x64, ARM64
            - macOS x64 (Intel), ARM64 (Apple Silicon)
          draft: false
          prerelease: false
          files: |
            ./artifacts/doomsummarizer-nogpu-win-x64/*.zip
            ./artifacts/doomsummarizer-win-x64/*.zip
            ./artifacts/lucidrag-win-x64/*.zip
            ./artifacts/doomsummarizer-nogpu-win-arm64/*.zip
            ./artifacts/doomsummarizer-win-arm64/*.zip
            ./artifacts/lucidrag-win-arm64/*.zip
            ./artifacts/doomsummarizer-nogpu-linux-x64/*.tar.gz
            ./artifacts/doomsummarizer-linux-x64/*.tar.gz
            ./artifacts/lucidrag-linux-x64/*.tar.gz
            ./artifacts/doomsummarizer-nogpu-linux-arm64/*.tar.gz
            ./artifacts/doomsummarizer-linux-arm64/*.tar.gz
            ./artifacts/lucidrag-linux-arm64/*.tar.gz
            ./artifacts/doomsummarizer-nogpu-osx-x64/*.tar.gz
            ./artifacts/doomsummarizer-osx-x64/*.tar.gz
            ./artifacts/lucidrag-osx-x64/*.tar.gz
            ./artifacts/doomsummarizer-nogpu-osx-arm64/*.tar.gz
            ./artifacts/doomsummarizer-osx-arm64/*.tar.gz
            ./artifacts/lucidrag-osx-arm64/*.tar.gz
