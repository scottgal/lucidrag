name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore .NET dependencies
        run: dotnet restore LucidRAG.sln

      - name: Audit direct and transitive NuGet dependencies
        run: |
          dotnet list LucidRAG.sln package \
            --vulnerable \
            --include-transitive \
            --format json \
            --output-version 1 > vulnerabilities.json
          jq -e '[
            .projects[]?.frameworks[]?
            | ((.topLevelPackages // []) + (.transitivePackages // []))[]?
            | select((.vulnerabilities // []) | length > 0)
          ] | length == 0' vulnerabilities.json

      - name: Audit npm lockfiles
        run: |
          npm audit --ignore-scripts
          npm --prefix LucidRAG.Website audit --ignore-scripts
          npm --prefix src/LucidRAG audit --ignore-scripts
          npm --prefix test-screenshots audit --ignore-scripts
          npm --prefix tools/build-mermaid-bundle audit --ignore-scripts

  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragdocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Free up disk space
        run: |
          # Remove pre-installed tools that consume disk space
          sudo rm -rf /usr/share/dotnet/shared/Microsoft.NETCore.App/6.* || true
          sudo rm -rf /usr/share/dotnet/shared/Microsoft.NETCore.App/7.* || true
          sudo rm -rf /usr/share/dotnet/shared/Microsoft.NETCore.App/8.* || true
          sudo rm -rf /usr/share/dotnet/shared/Microsoft.AspNetCore.App/6.* || true
          sudo rm -rf /usr/share/dotnet/shared/Microsoft.AspNetCore.App/7.* || true
          sudo rm -rf /usr/share/dotnet/shared/Microsoft.AspNetCore.App/8.* || true
          sudo rm -rf /usr/local/lib/android || true
          df -h /

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build DoomSummarizer
        run: dotnet build src/DoomSummarizer/DoomSummarizer.csproj --configuration Release

      - name: Build DoomSummarizer.Tests
        run: dotnet build src/DoomSummarizer.Tests/DoomSummarizer.Tests.csproj --configuration Release

      - name: Build Plugin.Books.Tests
        run: dotnet build src/Mostlylucid.DoomSummarizer.Plugin.Books.Tests/Mostlylucid.DoomSummarizer.Plugin.Books.Tests.csproj --configuration Release

      - name: Build CodeSummarizer.Core
        run: dotnet build src/CodeSummarizer.Core/CodeSummarizer.Core.csproj --configuration Release -p:GeneratePackageOnBuild=false

      - name: Build CodeSummarizer.Core.Tests
        run: dotnet build src/CodeSummarizer.Core.Tests/CodeSummarizer.Core.Tests.csproj --configuration Release

      - name: Build CodeSummarizer.Mermaid.Jint
        run: dotnet build src/CodeSummarizer.Mermaid.Jint/CodeSummarizer.Mermaid.Jint.csproj --configuration Release -p:GeneratePackageOnBuild=false

      - name: Build CodeSummarizer.Mermaid.Jint.Tests
        run: dotnet build src/CodeSummarizer.Mermaid.Jint.Tests/CodeSummarizer.Mermaid.Jint.Tests.csproj --configuration Release

      - name: Build LucidResearch
        run: dotnet build src/LucidResearch/LucidResearch.csproj --configuration Release

      - name: Build LucidResearch.Tests
        run: dotnet build src/LucidResearch.Tests/LucidResearch.Tests.csproj --configuration Release

      - name: Run DoomSummarizer tests
        run: |
          dotnet test src/DoomSummarizer.Tests/DoomSummarizer.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter 'Category!=Network&Category!=Smoke&Category!=RequiresModel&Category!=Benchmark&Category!=Integration' \
            --logger "console;verbosity=normal"

      - name: Run Plugin.Books tests
        run: |
          dotnet test src/Mostlylucid.DoomSummarizer.Plugin.Books.Tests/Mostlylucid.DoomSummarizer.Plugin.Books.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal"

      - name: Run CodeSummarizer.Core tests
        run: |
          dotnet test src/CodeSummarizer.Core.Tests/CodeSummarizer.Core.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal"

      - name: Run CodeSummarizer.Mermaid.Jint tests
        run: |
          dotnet test src/CodeSummarizer.Mermaid.Jint.Tests/CodeSummarizer.Mermaid.Jint.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal"

      - name: Run LucidResearch tests
        run: |
          dotnet test src/LucidResearch.Tests/LucidResearch.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal"
