name: Release LucidResearch CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build and test
        run: |
          dotnet build src/LucidResearch/LucidResearch.csproj -c Release
          dotnet test src/LucidResearch.Tests/LucidResearch.Tests.csproj \
            -c Release \
            --logger "console;verbosity=normal"

  build:
    needs: test
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: win-arm64
            os: windows-latest
            ext: .exe
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
          - rid: linux-arm64
            os: ubuntu-latest
            ext: ''
          - rid: osx-x64
            os: macos-latest
            ext: ''
          - rid: osx-arm64
            os: macos-latest
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish single-file
        shell: bash
        run: |
          dotnet publish src/LucidResearch/LucidResearch.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:Version=${{ github.event.inputs.version }} \
            -o ./publish/${{ matrix.rid }}

      - name: Stage archive contents
        shell: bash
        run: |
          mkdir -p ./stage
          cp ./publish/${{ matrix.rid }}/lucidresearch${{ matrix.ext }} ./stage/
          # macOS can't bundle native libs into single file — copy them alongside
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            cp ./publish/${{ matrix.rid }}/*.dylib ./stage/ 2>/dev/null || true
          fi
          cp src/LucidResearch/README.md ./stage/
          cp src/LucidResearch/appsettings.json ./stage/

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ./stage/* -DestinationPath "./publish/lucidresearch-${{ matrix.rid }}.zip"

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ./stage
          tar -czvf "../publish/lucidresearch-${{ matrix.rid }}.tar.gz" *

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: lucidresearch-${{ matrix.rid }}
          path: ./publish/lucidresearch-${{ matrix.rid }}.*
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: lucidresearch-v${{ github.event.inputs.version }}
          name: LucidResearch v${{ github.event.inputs.version }}
          body: |
            ## LucidResearch v${{ github.event.inputs.version }}

            **Autonomous academic research assistant.** LucidResearch is a TUI-based CLI that drives the [UltraResearch](https://github.com/scottgal/lucidrag) engine — an agentic loop that discovers, fetches, and indexes academic papers using citation graph topology, entity clusters, and LLM sentinel checkpoints to steer exploration.

            > **[Full documentation](https://github.com/scottgal/lucidrag/blob/main/src/LucidResearch/README.md)**

            ### Downloads

            | Platform | Archive |
            |----------|---------|
            | Windows x64 | `lucidresearch-win-x64.zip` |
            | Windows ARM64 | `lucidresearch-win-arm64.zip` |
            | Linux x64 | `lucidresearch-linux-x64.tar.gz` |
            | Linux ARM64 | `lucidresearch-linux-arm64.tar.gz` |
            | macOS Intel | `lucidresearch-osx-x64.tar.gz` |
            | macOS Apple Silicon | `lucidresearch-osx-arm64.tar.gz` |

            ### What it does

            - **Discovers** papers from arXiv, Semantic Scholar, and citation graphs
            - **Fetches** full text via ar5iv HTML, builds YAML frontmatter with metadata
            - **Indexes** through the DocSummarizer pipeline — ONNX embeddings, BM25, entity extraction
            - **Builds a knowledge graph** of authors, concepts, organizations, and their relationships
            - **Evaluates convergence** using LLM sentinel checkpoints and entity frequency analysis
            - **Promotes authors** to first-class graph entities with co-authorship relationships
            - **Provides a TUI dashboard** showing session progress, frontier, and checkpoints

            All from a single self-contained binary. No .NET runtime needed.

            ### Quick Start

            ```bash
            # Extract and run
            lucidresearch
            ```

            ### What's in the archive

            | File | Purpose |
            |------|---------|
            | `lucidresearch` | Self-contained single-file binary |
            | `README.md` | Full documentation |
            | `appsettings.json` | Default configuration |

            ### Platforms
            - Windows x64, ARM64
            - Linux x64, ARM64
            - macOS x64 (Intel), ARM64 (Apple Silicon)
          draft: false
          prerelease: false
          files: |
            ./artifacts/lucidresearch-win-x64/*.zip
            ./artifacts/lucidresearch-win-arm64/*.zip
            ./artifacts/lucidresearch-linux-x64/*.tar.gz
            ./artifacts/lucidresearch-linux-arm64/*.tar.gz
            ./artifacts/lucidresearch-osx-x64/*.tar.gz
            ./artifacts/lucidresearch-osx-arm64/*.tar.gz
