name: Publish DoomSummarizer Source Packages

on:
  push:
    tags:
      - 'doomsrchnv*'
      - 'doomsrcredditv*'
      - 'doomsrcgooglev*'
      - 'doomsrcnewsv*'
      - 'doomsrcwebv*'
      - 'doomsrcacademicv*'
      - 'doomsrcsciencev*'
      - 'doomsrcrefv*'
      - 'doomsrcimapv*'
      - 'doomsrcdocsv*'
      - 'doomsrcimagesv*'
      - 'doomsrcdatav*'
      - 'doomoutsmtpv*'
      - 'doomoutsendgridv*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (e.g., Source.HackerNews)'
        required: true
        type: choice
        options:
          - Source.HackerNews
          - Source.Reddit
          - Source.Google
          - Source.News
          - Source.Web
          - Source.Academic
          - Source.Science
          - Source.Reference
          - Source.Imap
          - Source.Documents
          - Source.Images
          - Source.Data
          - Output.Smtp
          - Output.SendGrid
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string
      core_version:
        description: 'DoomSummarizer.Core NuGet version to depend on (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  resolve-package:
    runs-on: ubuntu-latest
    outputs:
      project_path: ${{ steps.resolve.outputs.project_path }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      version: ${{ steps.resolve.outputs.version }}
      core_version: ${{ steps.resolve.outputs.core_version }}
    steps:
      - name: Resolve package from tag or input
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PACKAGE="${{ github.event.inputs.package }}"
            VERSION="${{ github.event.inputs.version }}"
            CORE_VERSION="${{ github.event.inputs.core_version }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
            # Map tag prefix to package name
            case "$TAG" in
              doomsrchnv*)       PACKAGE="Source.HackerNews"; VERSION="${TAG#doomsrchnv}" ;;
              doomsrcredditv*)   PACKAGE="Source.Reddit";     VERSION="${TAG#doomsrcredditv}" ;;
              doomsrcgooglev*)   PACKAGE="Source.Google";     VERSION="${TAG#doomsrcgooglev}" ;;
              doomsrcnewsv*)     PACKAGE="Source.News";       VERSION="${TAG#doomsrcnewsv}" ;;
              doomsrcwebv*)      PACKAGE="Source.Web";        VERSION="${TAG#doomsrcwebv}" ;;
              doomsrcacademicv*) PACKAGE="Source.Academic";   VERSION="${TAG#doomsrcacademicv}" ;;
              doomsrcsciencev*)  PACKAGE="Source.Science";    VERSION="${TAG#doomsrcsciencev}" ;;
              doomsrcrefv*)      PACKAGE="Source.Reference";  VERSION="${TAG#doomsrcrefv}" ;;
              doomsrcimapv*)     PACKAGE="Source.Imap";       VERSION="${TAG#doomsrcimapv}" ;;
              doomsrcdocsv*)     PACKAGE="Source.Documents";  VERSION="${TAG#doomsrcdocsv}" ;;
              doomsrcimagesv*)   PACKAGE="Source.Images";     VERSION="${TAG#doomsrcimagesv}" ;;
              doomsrcdatav*)     PACKAGE="Source.Data";       VERSION="${TAG#doomsrcdatav}" ;;
              doomoutsmtpv*)     PACKAGE="Output.Smtp";       VERSION="${TAG#doomoutsmtpv}" ;;
              doomoutsendgridv*) PACKAGE="Output.SendGrid";   VERSION="${TAG#doomoutsendgridv}" ;;
              *)                 echo "Unknown tag prefix: $TAG"; exit 1 ;;
            esac
            # For tag-triggered builds, core version defaults to the same version.
            # Override via workflow_dispatch if source and core versions diverge.
            CORE_VERSION="$VERSION"
          fi

          PROJECT_PATH="src/Mostlylucid.DoomSummarizer.${PACKAGE}/Mostlylucid.DoomSummarizer.${PACKAGE}.csproj"
          echo "project_path=$PROJECT_PATH" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "Publishing Mostlylucid.DoomSummarizer.${PACKAGE} v${VERSION} (Core: v${CORE_VERSION})"

  build-and-publish:
    needs: resolve-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: |
          dotnet restore ${{ needs.resolve-package.outputs.project_path }} \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.resolve-package.outputs.core_version }}

      - name: Build
        run: |
          dotnet build ${{ needs.resolve-package.outputs.project_path }} \
            --configuration Release \
            --no-restore \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.resolve-package.outputs.core_version }} \
            -p:MinVerVersionOverride=${{ needs.resolve-package.outputs.version }}

      - name: Pack
        run: |
          dotnet pack ${{ needs.resolve-package.outputs.project_path }} \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:UseNuGetDependency=true \
            -p:CorePackageVersion=${{ needs.resolve-package.outputs.core_version }} \
            -p:MinVerVersionOverride=${{ needs.resolve-package.outputs.version }}

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Login to NuGet (OIDC)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: 'mostlylucid'

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate --no-symbols

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ needs.resolve-package.outputs.package_name }}
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
